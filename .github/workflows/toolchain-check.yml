name: Toolchain check

# Step 0: builds libnx32 and mesa32 (the 32-bit Switch libraries) in the same
# Docker toolchain the existing ports use, then compile-checks the android32
# runtime against them. No game code and no game files are involved.
# Start it by hand: Actions tab -> "Toolchain check" -> Run workflow.

on:
  workflow_dispatch:

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Get the libraries
        run: |
          mkdir -p work
          git clone --depth 1 https://github.com/aks796/libnx32 work/libnx32
          git clone --depth 1 https://github.com/aks796/mesa32 work/mesa32
          git clone --depth 1 https://github.com/aks796/android32 work/runtime

      - name: Run containers as root
        run: |
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/docker" <<'WRAP'
          #!/bin/sh
          if [ "$1" = "run" ]; then
            shift
            exec /usr/bin/docker run --user root "$@"
          fi
          exec /usr/bin/docker "$@"
          WRAP
          chmod +x "$HOME/bin/docker"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          chmod -R a+rwX work

      - name: Cache key
        id: shas
        run: |
          A=$(git -C work/libnx32 rev-parse HEAD)
          B=$(git -C work/mesa32 rev-parse HEAD)
          echo "key=libs-$A-$B" >> "$GITHUB_OUTPUT"

      - name: Restore built libraries
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            work/libnx32/prefix
            work/mesa32/prefix
          key: ${{ steps.shas.outputs.key }}

      - name: Pull toolchain image
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker pull --platform linux/amd64 ghcr.io/vita2hos/devcontainer/vita2hos:latest

      - name: Container write test
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          which docker
          docker run --rm --platform linux/amd64 -v "$PWD/work/libnx32:/work" -w /work ghcr.io/vita2hos/devcontainer/vita2hos:latest bash -lc 'id; ls -ld /work /work/nx; touch /work/nx/.write_test && echo WRITE_OK && rm /work/nx/.write_test'

      - name: Build libnx32
        if: steps.cache.outputs.cache-hit != 'true'
        run: cd work/libnx32 && ./build.sh

      - name: Build mesa32 (slow)
        if: steps.cache.outputs.cache-hit != 'true'
        run: cd work/mesa32 && ./build.sh

      - name: Show what was built
        run: |
          ls -la work/libnx32/prefix/lib work/mesa32/prefix/lib

      - name: Compile-check the android32 runtime
        run: |
          export DCR_LIBNX32="$PWD/work/libnx32/prefix"
          export PORTLIBS32="$PWD/work/mesa32/prefix"
          sh work/runtime/tools/check.sh

      - name: Give files back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" work || true

      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-logs
          path: |
            work/mesa32/build/meson-logs
            work/libnx32/prefix/lib
          if-no-files-found: ignore
